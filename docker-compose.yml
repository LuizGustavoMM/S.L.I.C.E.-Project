version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mas-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    container_name: mas-ollama-pull
    entrypoint: /bin/sh
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    command: -c "sleep 15 && ollama pull llama3"

  webui:
    build: ./webui
    container_name: mas-webui
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./workspace:/workspace
    depends_on:
      - ollama

volumes:
  ollama_data: